<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShraSquad Bike Customizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <main id="viewport"></main>

  <div class="controls-hint" id="controlsHint">
    <span>🖱️ drag to rotate</span><i></i><span>scroll to zoom</span><i></i><span>click a part to customize</span>
  </div>

  <aside id="panel">
    <header class="brand">
      <div class="brand-mark">🚲</div>
      <div>
        <h1>ShraSquad</h1>
        <p>Bike Customizer</p>
      </div>
    </header>

    <div class="panel-scroll">
      <section>
        <label class="field-label" for="buildName">Build name</label>
        <input id="buildName" type="text" placeholder="e.g. Sunset Cruiser" value="My Custom Build" autocomplete="off" />
      </section>

      <section>
        <span class="field-label">Parts</span>
        <div id="partList" class="part-grid"></div>
      </section>

      <section>
        <div class="section-head">
          <span class="field-label">Customize</span>
          <span id="selectedPart" class="selected-chip">Frame</span>
        </div>

        <div class="preset-row" id="presetRow"></div>

        <div class="color-custom">
          <input id="colorPicker" type="color" value="#c0392b" aria-label="Custom color" />
          <span id="colorHex" class="color-hex">#C0392B</span>
          <span class="color-custom-label">custom</span>
        </div>

        <div class="segmented" id="finishSeg" role="radiogroup" aria-label="Finish">
          <button data-finish="gloss"    class="seg-btn">Gloss</button>
          <button data-finish="matte"    class="seg-btn">Matte</button>
          <button data-finish="metallic" class="seg-btn">Metallic</button>
          <button data-finish="chrome"   class="seg-btn">Chrome</button>
        </div>
      </section>

      <section>
        <span class="field-label">Match a real bike</span>
        <div id="dropzone" class="dropzone" tabindex="0">
          <input id="photoInput" type="file" accept="image/*" hidden />
          <div class="dz-inner" id="dzInner">
            <span class="dz-icon">📷</span>
            <span class="dz-text">Drop a photo or <u>browse</u></span>
            <span class="dz-sub">colors are extracted locally — nothing uploads</span>
          </div>
          <img id="photoPreview" alt="Reference photo" hidden />
        </div>
        <div id="palette" class="palette"></div>
      </section>
    </div>

    <footer class="panel-actions">
      <button id="exportBtn" class="btn-primary">
        <span class="btn-label">Export Spec Sheet</span>
        <span class="btn-sub">PDF for your paint shop</span>
      </button>
      <button id="resetBtn" class="btn-ghost">Reset</button>
    </footer>
  </aside>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
