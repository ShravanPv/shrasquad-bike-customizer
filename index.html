<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>ShraSquad Garage — Bike Customizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <main id="viewport"></main>

  <div class="controls-hint" id="controlsHint">
    <span>Drag to rotate</span><i></i><span>Scroll to zoom</span><i></i><span>Click a part to paint it</span>
  </div>

  <!-- DOM order == keyboard keys 1–5 (main.js relies on it). The auto-rotate toggle comes
       AFTER the five .cam-btn and is not one of them, so the key mapping is unchanged. -->
  <div class="cam-presets" id="camPresets" role="group" aria-label="Camera presets">
    <!-- Mutually exclusive views: main.js marks the one on screen with aria-current, not aria-pressed -->
    <button class="cam-btn" data-view="side"    title="Side view (1)"><kbd>1</kbd>Side</button>
    <button class="cam-btn" data-view="front"   title="Front view (2)"><kbd>2</kbd>Front</button>
    <button class="cam-btn" data-view="quarter" title="Three-quarter view (3)"><kbd>3</kbd>¾</button>
    <button class="cam-btn" data-view="rear"    title="Rear view (4)"><kbd>4</kbd>Rear</button>
    <button class="cam-btn" data-view="tank"    title="Tank close-up (5)"><kbd>5</kbd>Tank</button>
    <button class="cam-toggle" id="autoRotateBtn" aria-label="Auto-rotate" aria-pressed="true" title="Auto-rotate on">
      <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <!-- Shown only while auto-rotate is off: the state is never colour alone -->
        <path class="ico-slash" d="m3 3 18 18" />
      </svg>
    </button>
  </div>

  <aside id="panel">
    <header class="brand">
      <div class="wordmark">
        <h1>ShraSquad</h1>
        <span class="wordmark-sub">Garage</span>
      </div>
      <p class="brand-tag">Bike<br />Customizer</p>
    </header>

    <div class="panel-scroll">
      <section>
        <label class="field-label" for="buildName">Build name</label>
        <input id="buildName" type="text" placeholder="e.g. Sunset Cruiser" value="My Custom Build" autocomplete="off" />
      </section>

      <section>
        <span class="field-label">Bike type</span>
        <div class="segmented seg-3" id="typeSeg" role="radiogroup" aria-label="Bike type">
          <button data-type="cruiser" class="seg-btn" role="radio" aria-checked="false">Cruiser</button>
          <button data-type="adv" class="seg-btn" role="radio" aria-checked="false">ADV</button>
          <button data-type="cafe" class="seg-btn" role="radio" aria-checked="false">Café</button>
        </div>
      </section>

      <section>
        <span class="field-label">Accessories</span>
        <div id="accList" class="part-grid"></div>
      </section>

      <section>
        <span class="field-label">Parts</span>
        <!-- Single-select: one radio per part, roving focus (arrow keys) handled in main.js -->
        <div id="partList" class="part-grid" role="radiogroup" aria-label="Parts"></div>
      </section>

      <section>
        <div class="section-head">
          <span class="field-label">Customize</span>
          <span id="selectedPart" class="selected-chip" aria-live="polite">Frame</span>
        </div>

        <div class="preset-row" id="presetRow"></div>

        <div class="color-custom">
          <input id="colorPicker" type="color" value="#c0392b" aria-label="Custom color" />
          <span id="colorHex" class="color-hex">#C0392B</span>
          <span class="color-custom-label">custom</span>
        </div>

        <div class="segmented" id="finishSeg" role="radiogroup" aria-label="Finish">
          <button data-finish="gloss"    class="seg-btn" role="radio" aria-checked="false">Gloss</button>
          <button data-finish="matte"    class="seg-btn" role="radio" aria-checked="false">Matte</button>
          <button data-finish="metallic" class="seg-btn" role="radio" aria-checked="false">Metallic</button>
          <button data-finish="chrome"   class="seg-btn" role="radio" aria-checked="false">Chrome</button>
        </div>
      </section>

      <section>
        <span class="field-label">Match a real bike</span>
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Drop a photo or browse to match a real bike">
          <input id="photoInput" type="file" accept="image/*" hidden />
          <div class="dz-inner" id="dzInner">
            <svg class="dz-icon ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M4 8h3.2l1.8-3h6l1.8 3H20v11H4z" />
              <circle cx="12" cy="13" r="3.5" />
            </svg>
            <span class="dz-text">Drop a photo or <u>browse</u></span>
            <span class="dz-sub">its colors are applied to the 3D bike — all locally, nothing uploads</span>
          </div>
          <img id="photoPreview" alt="Reference photo" hidden />
        </div>
        <div id="palette" class="palette"></div>
      </section>
    </div>

    <footer class="panel-actions">
      <button id="exportBtn" class="btn-primary">
        <span class="btn-label">Export Spec Sheet</span>
        <span class="btn-sub">PDF for your paint shop</span>
      </button>
      <button id="resetBtn" class="btn-ghost">Reset</button>
      <button id="shareBtn" class="btn-ghost" title="Copy a link that reopens this exact build">Copy share link</button>
    </footer>
  </aside>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
